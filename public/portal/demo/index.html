<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hire portal demo | Max Healthcare Equipment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231F20">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face{font-family:'Helvetica Rounded';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/helvetica-rounded-bold.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/figtree-latin-wght-normal.woff2) format('woff2')}
:root{
  --red:#ED1B24; --red-ink:#C8131B; --red-hover:#A90F16; --red-soft:#FDECEC;
  --char:#231F20; --char-2:#4B4647; --muted:#625D5E; --grey:#929296;
  --paper:#F1F1F0; --surface:#FFFFFF; --line:#E3E1E1; --line-2:#EFEDED;
  --ok:#0E7C5F; --ok-soft:#E1F1EA; --warn:#94570A; --warn-soft:#FBEFD9; --info:#1D5FA8; --info-soft:#E7EEF8;
  --display:'Helvetica Rounded','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--char);font:16px/1.55 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0 0 .5rem;letter-spacing:-.005em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0 0 .75rem}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-ink)}
:focus-visible{outline:3px solid var(--red-ink);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.875rem} .centre{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--char);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top .home{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.top .home img{height:32px;width:auto;display:block}
.top .home span{font-weight:700;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.09);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;color:#ECEAEA;border-radius:999px;padding:7px 15px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--char)}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 4px}
.top .back{color:#fff;text-decoration:none;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px}
.top .back:hover{background:rgba(255,255,255,.08)}
@media (max-width:760px){.top{position:static}.top .home span{display:none}.seg{order:3;width:100%}}

/* stage */
.stage{max-width:1380px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:28px;align-items:start}
#app{min-width:0}
@media (max-width:1040px){.stage{grid-template-columns:1fr}}
@media (max-width:520px){.stage{padding:14px 12px 40px;gap:18px}}

/* scenario rail */
.rail h1{font-size:2rem;max-width:20ch}
.rail .intro{color:var(--char-2);max-width:56ch;margin-bottom:22px}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scen article{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.scen article.on{border-color:var(--char);box-shadow:0 0 0 1px var(--char)}
.scen .who{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scen .who strong{font-size:1.02rem}
.scen p{margin:0;color:var(--char-2);font-size:.94rem}
.scen .row{margin-top:auto}
.howto{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.howto h3{margin-bottom:4px}
.howto p{font-size:.92rem;color:var(--char-2);margin:0}

/* browser frame */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0;box-shadow:0 1px 0 rgba(35,31,32,.04),0 28px 56px -34px rgba(35,31,32,.32)}
.urlbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--paper);border-bottom:1px solid var(--line);font-size:.84rem;color:var(--char-2);white-space:nowrap;overflow-x:auto}
.urlbar .dots{display:flex;gap:6px}
.urlbar .dots i{width:10px;height:10px;border-radius:50%;background:#D9D6D6}
.urlbar .addr{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.app-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 22px;border-bottom:3px solid var(--red)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto;display:block}
.brand .sub{color:var(--muted);font-size:.9rem;border-left:1px solid var(--line);padding-left:12px}
.app-head .who{margin-left:auto;text-align:right;font-size:.9rem;line-height:1.3}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 10px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--char)}
.tabs button[aria-selected="true"]{color:var(--char);border-color:var(--char)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red-ink);color:#fff;font-size:.75rem;line-height:20px;text-align:center}
.body{padding:22px}
@media (max-width:620px){.body{padding:16px}.app-head{padding:12px 16px}}

/* elements */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--char);font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--char)}
.btn.primary{background:var(--red-ink);border-color:var(--red-ink);color:#fff}
.btn.primary:hover{background:var(--red-hover);border-color:var(--red-hover)}
.btn.dark{background:var(--char);border-color:var(--char);color:#fff}
.btn.dark:hover{background:#000}
.btn.danger{color:var(--red-ink);border-color:#F1C2C4}
.btn.danger:hover{border-color:var(--red-ink)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.875rem;border-radius:10px}
.btn.block{width:100%}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.btn:disabled,.btn:disabled:hover{opacity:.42;cursor:not-allowed;border-color:var(--line)}
.btn.primary:disabled{border-color:var(--red-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.92rem;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],input[type=number],select,textarea{border:1.5px solid #D5D2D2;background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--char);outline:3px solid rgba(35,31,32,.12);outline-offset:0}
textarea{min-height:84px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px}
legend{font-family:var(--display);padding:0 6px;font-size:1rem}
.req::after{content:" *";color:var(--red-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;line-height:1.4}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--red-soft);color:var(--red-ink)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.grey{background:var(--paper);color:var(--char-2)}
.notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.notice.good{background:var(--ok-soft);color:#0A5A45}
.notice.warn{background:var(--warn-soft);color:#6F4207}
.notice.bad{background:var(--red-soft);color:#9B0F15}
.notice.info{background:var(--info-soft);color:#174C86}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.panel h2{font-size:1.05rem;margin-bottom:10px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--char);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAFA}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.thumb{width:100%;aspect-ratio:4/3;border-radius:12px;background:#F7F7F6;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}

/* PIN pad */
.pinwrap{max-width:380px;margin:8px auto;text-align:center}
.staffpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
.staffpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.staffpick button[aria-pressed="true"]{border-color:var(--char);background:var(--char);color:#fff}
.pdots{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--grey)}
.pdots i.on{background:var(--red);border-color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{font-family:var(--display);font-size:1.5rem;padding:14px 0;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.keys button:hover{border-color:var(--char)}
.keys button:active{background:var(--paper)}

/* catalogue */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prod{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.prod .name{font-weight:700;line-height:1.3}
.price{font-size:.9rem;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);margin-left:4px}
.keyrange{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.krow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface)}
.krow .thumb{width:52px;height:52px;flex:none;aspect-ratio:auto;border-radius:10px}
.krow .nm{flex:1;min-width:0;font-size:.94rem;line-height:1.25;font-weight:600}
.krow .nm .small{font-weight:400}
.krow label{display:flex;align-items:center;gap:4px;font-size:.86rem;cursor:pointer}
.krow input{width:18px;height:18px;accent-color:var(--red-ink)}

/* hospital board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card.ready{border:2px solid var(--ok);background:var(--ok-soft)}
.tick{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.tick svg{width:34px;height:34px}
.card.ready .tick{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* phone */
.phone-wrap{position:sticky;top:78px;display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:384px;height:min(800px,calc(100vh - 120px));min-height:600px;background:var(--char);border-radius:52px;padding:12px;box-shadow:0 30px 60px -30px rgba(35,31,32,.55),inset 0 0 0 2px #3A3536}
.screen{position:relative;height:100%;background:#fff;border-radius:41px;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:20px;background:var(--char);z-index:2}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 6px;font-size:.8rem;font-weight:700;flex:none}
.sbar .sig{display:flex;gap:2px;align-items:flex-end}
.sbar .sig i{width:3px;background:var(--char);border-radius:1px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.phone-cap{font-size:.86rem;color:var(--muted);text-align:center;max-width:340px;margin:0}
@media (max-width:1040px){.phone-wrap{position:static}}
@media (max-width:520px){
  .phone{width:100%;height:auto;min-height:0;border-radius:0;padding:0;background:none;box-shadow:none}
  .screen{border-radius:18px;border:1px solid var(--line);min-height:620px}
  .island,.sbar{display:none}
  .scroll{overflow:visible}
}

/* messages app */
.mhead{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--line-2);flex:none}
.mhead h2{margin:0;font-size:1.4rem;flex:1}
.mhead .t{flex:1;min-width:0;text-align:center;line-height:1.2}
.mhead .t strong{display:block;font-size:.98rem}
.mhead .t span{font-size:.78rem;color:var(--muted)}
.mhead .bk{background:none;border:0;color:var(--red-ink);font-weight:700;cursor:pointer;padding:6px 2px;min-width:64px;text-align:left}
.mhead .sp{min-width:64px}
.trow{display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line-2);background:#fff;width:100%;text-align:left;cursor:pointer}
.trow:hover{background:#FAFAFA}
.av{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;overflow:hidden}
.av img{width:30px;height:30px;object-fit:contain;filter:brightness(0) invert(1)}
.av.staff{background:var(--char);color:#fff;font-weight:700;font-size:.85rem}
.trow .tx{flex:1;min-width:0}
.trow .tx strong{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.trow .tx strong span{font-weight:400;color:var(--muted);font-size:.78rem}
.trow .tx p{margin:0;font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .unread{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.thread{display:flex;flex-direction:column;padding:12px 14px 16px}
.when{font-size:.74rem;color:var(--muted);text-align:center;margin:12px 0 4px}
.b{max-width:84%;padding:10px 13px;border-radius:20px;margin:3px 0;font-size:.94rem;line-height:1.42;white-space:pre-line;word-wrap:break-word}
.b.left{background:#ECEBEB;border-bottom-left-radius:6px;align-self:flex-start}
.b.right{background:var(--char);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.b.failed{border:1.5px dashed var(--red-ink)}
.b .lnk{display:inline;background:none;border:0;padding:0;color:#1D5FA8;text-decoration:underline;font-weight:600;cursor:pointer;text-align:left}
.b.right .lnk{color:#fff}
.b .st{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.reply{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);flex:none}
.reply input{border-radius:999px;min-height:40px;padding:8px 14px}
.reply button{border:0;background:var(--char);color:#fff;border-radius:999px;padding:0 16px;font-weight:700;cursor:pointer}
.home-apps{padding:24px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-size:.74rem;color:var(--char);position:relative}
.appicon i{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:800}
.appicon .badge{position:absolute;top:-4px;right:6px;background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}

/* in-phone browser + portal */
.bbar{display:flex;align-items:center;gap:8px;padding:4px 12px 8px;border-bottom:1px solid var(--line-2);flex:none}
.bbar .addr{flex:1;min-width:0;background:var(--paper);border-radius:10px;padding:7px 10px;text-align:center;font-size:.8rem;color:var(--char-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar .addr b{font-weight:600;color:var(--char)}
.bbar button{background:none;border:0;color:var(--red-ink);font-weight:700;cursor:pointer;padding:6px 2px;font-size:.9rem}
.masthead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:3px solid var(--red)}
.masthead img{height:30px;width:auto;display:block}
.masthead span{color:var(--muted);font-size:.86rem;border-left:1px solid var(--line);padding-left:10px}
.pp{padding:20px 18px 30px}
.pp h1{font-size:1.5rem}
.lede{color:var(--char-2);margin-bottom:18px}
.sec{padding:16px 0;border-top:1px solid var(--line-2)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec>h2{font-size:1.08rem;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0}
.kv+.kv{border-top:1px solid var(--line-2)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv.total .k{color:var(--char);font-weight:700}
.kv.total .v{font-weight:800}
.grp{font-size:.86rem;font-weight:700;color:var(--muted);margin:14px 0 2px}
.item{display:flex;gap:12px;align-items:center;padding:8px 0}
.item+.item{border-top:1px solid var(--line-2)}
.item .ph{width:48px;height:48px;border-radius:12px;background:#F7F7F6;flex:none;overflow:hidden;display:grid;place-items:center}
.item .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.item .nm{flex:1;min-width:0;line-height:1.3}
.item .nm small{display:block;color:var(--muted);font-size:.82rem}
.item .rt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .rt small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.item.done{opacity:.55}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:inherit;transition:border-color .15s,background-color .15s}
.choice:hover{border-color:var(--grey)}
.choice[aria-pressed="true"]{border-color:var(--red-ink);background:var(--red-soft);box-shadow:0 0 0 1px var(--red-ink)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice h3{margin:0}
.choice .amt{display:block;font-family:var(--display);font-size:1.45rem;margin:6px 0 0;font-variant-numeric:tabular-nums}
.choice .then{display:block;font-size:1.05rem;color:var(--char-2);font-weight:600}
.choice .sub{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}
.save{display:inline-block;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:.8rem;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.consent{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.consent input{width:22px;height:22px;accent-color:var(--red-ink);flex:none;margin:2px 0 0}
.consent label{font-size:.95rem;line-height:1.45;cursor:pointer}
.terms{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--char-2);margin-bottom:14px}
.terms p:last-child{margin:0}
.pick{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.pick input{width:22px;height:22px;accent-color:var(--red-ink);flex:none;margin:0}
.pick label{flex:1;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.foot{color:var(--muted);font-size:.88rem;text-align:center;margin-top:18px}
.steps{display:flex;list-style:none;margin:0 0 20px;padding:0;counter-reset:s}
.steps li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.2}
.steps li::before{counter-increment:s;content:counter(s);position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.steps li+li::after{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line)}
.steps li.done::before{content:"\2713";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done::after,.steps li.cur::after{background:var(--ok)}
.steps li.cur{color:var(--char);font-weight:700}
.steps li.cur::before{border-color:var(--red-ink);color:var(--red-ink)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--red-ink);animation:sp 1s linear infinite;margin:40px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* stripe hosted checkout look */
.stripe{background:#F6F8FA;min-height:100%;padding:18px 18px 28px;color:#1A1F36;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.stripe .merchant{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:16px}
.stripe .merchant .av{width:30px;height:30px}
.stripe .merchant .av img{width:20px;height:20px}
.stripe .lab{color:#697386;font-size:.9rem}
.stripe .big{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.stripe .then{color:#697386;font-size:.9rem;margin-bottom:18px}
.stripe .apple{width:100%;height:46px;border:0;border-radius:8px;background:#000;color:#fff;font-weight:600;font-size:1.02rem;cursor:pointer}
.stripe .or{display:flex;align-items:center;gap:10px;color:#697386;font-size:.85rem;margin:16px 0}
.stripe .or::before,.stripe .or::after{content:"";flex:1;height:1px;background:#E3E8EE}
.stripe .ci{background:#fff;border:1px solid #E0E6EB;border-radius:8px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.stripe .ci input{border:0;border-radius:0;min-height:44px;font-size:.95rem}
.stripe .ci .r{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #E0E6EB}
.stripe .ci .r input+input{border-left:1px solid #E0E6EB}
.stripe .lbl{font-size:.88rem;color:#3C4257;margin:14px 0 6px;display:block}
.stripe .pay{width:100%;height:48px;border:0;border-radius:8px;background:var(--red-ink);color:#fff;font-weight:600;font-size:1.02rem;margin-top:18px;cursor:pointer}
.stripe .err{color:#DF1B41;font-size:.9rem;margin-top:10px}
.stripe .pw{font-size:.76rem;color:#8792A2;text-align:center;margin-top:18px}
.stripe .demo{display:block;margin:12px auto 0;background:none;border:0;color:#697386;text-decoration:underline;font-size:.82rem;cursor:pointer}

/* back office */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:12px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);text-align:left;cursor:pointer;color:inherit}
.tile:hover{border-color:var(--char)}
.tile .k{color:var(--muted);font-size:.86rem;font-weight:600}
.tile .v{font-family:var(--display);font-size:1.75rem;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.alert .v{color:var(--red-ink)}
.hub{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.hub{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:140px 1fr 42px;gap:10px;align-items:center;margin:9px 0;font-size:.9rem}
.bar .track{display:block;height:12px;background:var(--line-2);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--char);border-radius:999px}
.bar .fill.red{background:var(--red)}
.bar .fill.grey{background:var(--grey)}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.q{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:12px 0;cursor:pointer;color:inherit}
.q:first-of-type{border-top:0}
.q:hover strong{text-decoration:underline}
.q .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--grey)}
.q .dot.bad{background:var(--red)} .q .dot.warn{background:#D98C17} .q .dot.info{background:var(--info)}
.q .tx{flex:1;min-width:0}
.q .tx span{display:block;color:var(--muted);font-size:.86rem}
.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}

.dhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.dhead h1{margin:0;font-size:1.45rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.9rem;color:var(--char-2);margin-bottom:16px}
.facts b{color:var(--char)}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{justify-content:flex-start;text-align:left}
.convo{background:var(--paper);border-radius:14px;padding:12px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column}
.convo .b.left{background:#fff}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:.9rem}
.tl li:first-child{border-top:0}
.tl i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--grey)}
.tl i.pay{background:var(--ok)} .tl i.sms{background:var(--info)} .tl i.bad{background:var(--red)}
.tl small{color:var(--muted);white-space:nowrap}
.tl span{display:block;color:var(--muted);font-size:.84rem}
.job{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.job .jg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;margin-top:8px;font-size:.88rem}
.job .jg div span{display:block;color:var(--muted);font-size:.8rem}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.photos div{aspect-ratio:1;border-radius:10px;background:#F7F7F6;overflow:hidden;position:relative}
.photos img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(35,31,32,.75);color:#fff;font-size:.7rem;border-radius:6px;padding:1px 6px}

/* modal, doc, toast */
.modal-bg{position:fixed;inset:0;background:rgba(35,31,32,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:22px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal h2{margin-bottom:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff}
.doc .dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:14px}
.doc .dh img{height:34px}
.stepper{display:flex;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--char);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;max-width:90vw;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);font-weight:600}

@media print{.top,.phone-wrap,.urlbar,.tabs,.no-print{display:none!important}.stage{display:block;padding:0}.modal-bg{position:static;background:none}}

function link(ha,kind,token,silent){var t=token||('tk-'+rnd(8));S.links[t]={ha:ha,kind:kind,expired:false,code:rnd(4)};return t;}
function thread(mobile,name){if(!S.threads[mobile])S.threads[mobile]={name:name||mobile,msgs:[]};else if(name&&S.threads[mobile].name.indexOf('Patient')===0)S.threads[mobile].name=name;return S.threads[mobile];}
function haById(id){for(var i=0;i<S.agreements.length;i++){if(S.agreements[i].id===id)return S.agreements[i];}return null;}
function haByMobile(m){var n=String(m).replace(/\D/g,'');var hit=null;S.agreements.forEach(function(a){if(a.mobile.replace(/\D/g,'')===n&&a.status!=='Completed')hit=a;});return hit;}
function fullName(a){return (a.first||a.last)?(a.first+' '+a.last).trim():'Patient '+a.mobile;}
function addr(a){var x=a.address;if(!x.line1)return '';return (x.line2?x.line2+', ':'')+x.line1+', '+x.suburb+' '+x.state+' '+x.postcode;}
function tl(a,kind,title,detail){a.timeline.unshift({at:stamp(),kind:kind,title:title,detail:detail||''});}

/* ---------- SMS ---------- */
function text(a,body,kind,opts){
  opts=opts||{};var tok=null;
  if(kind){tok=link(a.id,kind);}
  var t=thread(a.mobile,fullName(a));
  t.msgs.push({dir:'out',body:body,token:tok,at:stamp(),read:true,seen:false});
  tl(a,'sms',opts.title||'Text sent',body.length>90?body.slice(0,88)+'...':body);
  return tok;
}

function unreadInbound(){var n=0;Object.keys(S.threads).forEach(function(k){S.threads[k].msgs.forEach(function(m){if(m.dir==='in'&&!m.read)n++;});});return n;}
function undelivered(){var n=0;Object.keys(S.threads).forEach(function(k){S.threads[k].msgs.forEach(function(m){if(m.failed)n++;});});return n;}
function unseenOut(){var n=0;Object.keys(S.threads).forEach(function(k){S.threads[k].msgs.forEach(function(m){if(m.dir==='out'&&!m.seen)n++;});});return n;}

/* ---------- pricing ---------- */
function rate(l){var p=prod(l.pid);return (l.mode==='hire'?p.hire:p.buy)*l.qty;}
function hireLines(a){return a.lines.filter(function(l){return l.mode==='hire';});}
function saleLines(a){return a.lines.filter(function(l){return l.mode==='buy';});}
function billable(a){return hireLines(a).filter(function(l){return l.state==='on'||(l.state==='collect'&&CFG.billUntilCollection);});}
function discountPct(a){return a.plan===WEEKLY?CFG.weeklyDiscount:0;}
function weeklyGross(a){return sum(billable(a).map(rate));}
function weeklyNet(a){return r2(weeklyGross(a)*(1-discountPct(a)/100));}
function contracted(a){return sum(hireLines(a).filter(function(l){return l.state!=='back';}).map(rate));}
function saleOwing(a){return sum(saleLines(a).filter(function(l){return !l.paid;}).map(rate));}
function quote(a){
  var g=contracted(a),sale=saleOwing(a);
  var wk=r2(g*(1-CFG.weeklyDiscount/100)),up=r2(g*4*(1-CFG.upfrontDiscount/100));
  return {perWeek:wk,weeklyToday:r2(wk+sale),upfront:up,upfrontToday:r2(up+sale),sale:sale,saving:r2(g-wk)};
}
function paidSoFar(a){return r2(sum(a.payments.filter(function(p){return !p.failed;}).map(function(p){return p.refund?-p.amt:p.amt;})));}
function isSaleOnly(a){return hireLines(a).length===0;}
function pay(a,amt,type,extra){var p={id:'TXN-'+(S.seq.txn++),date:today(),type:type,amt:r2(amt)};for(var k in extra)p[k]=extra[k];a.payments.push(p);return p;}

function screenFor(tok){
  var ln=S.links[tok];
  if(!ln)return {s:'S-08',reason:'INVALID'};
  if(ln.expired)return {s:'S-08',reason:'EXPIRED_TOKEN'};
  var a=haById(ln.ha);
  if(ln.kind==='logistics'){var j=pendingJob(a);if(j&&!j.confirmed)return {s:'S-07',a:a,job:j};}
  if(a.status==='Awaiting Payment')return {s:'S-02',a:a};
  if(a.plan===UPFRONT&&a.status==='Active'&&a.termEnd&&daysUntil(a.termEnd)<=5&&billable(a).length)return {s:'S-09',a:a};
  return {s:'S-05',a:a};
}
function pendingJob(a){for(var i=0;i<a.jobs.length;i++){if(a.jobs[i].status==='Scheduled')return a.jobs[i];}return null;}

function portal(){
  var P=S.phone;
  if(P.stripe)return stripePage();
  if(P.view==='login')return mast()+loginScreen();
  var r=screenFor(P.token);
  if(r.s==='S-08')return mast()+errorScreen(r.reason);
  var a=r.a;
  if(P.view==='end')return mast()+endRequest(a);
  if(P.view==='shop')return mast()+shopScreen(a);
  if(P.view==='receipt')return mast()+receiptScreen(a);
  if(r.s==='S-02')return mast()+planScreen(a);
  if(r.s==='S-07')return mast()+logisticsScreen(a,r.job);
  if(r.s==='S-09')return mast()+renewalScreen(a);
  return mast()+manageScreen(a);
}

function summary(a,forQuote){

  }else{

function pinKey(k){
  if(k==='clear'){S.pinEntry='';S.pinMsg='';return;}
  if(k!=='enter'){if(S.pinEntry.length<6)S.pinEntry+=k;S.pinMsg='';if(S.pinEntry.length<4)return;if(S.pinEntry.length<6)return;}
  tryPin();
}
function tryPin(){
  var pin=S.pinEntry;if(pin.length<4){S.pinMsg='Enter at least 4 digits.';return;}
  var pool=S.staff.filter(function(s){return s.active&&(!S.pickStaff||s.id===S.pickStaff);});
  var hit=null;pool.forEach(function(s){if(s.pin===pin)hit=s;});
  if(hit&&hit.locked){S.pinMsg=hit.name+' is locked after too many wrong PINs. Ask your Hospital Admin to reset it.';S.pinEntry='';return;}
  if(hit){hit.fails=0;S.session=hit.id;S.pinEntry='';S.pinMsg='';S.lockedReason='';S.pickStaff=null;S.hTab='board';audit('Signed in');armIdle();return;}
  if(S.pickStaff){var s=staffById(S.pickStaff);s.fails++;if(s.fails>=5){s.locked=true;S.pinMsg='Too many wrong PINs. '+s.name+' is now locked.';audit('Account locked after 5 wrong PINs',s.name);}else{S.pinMsg='That PIN is not right. '+(5-s.fails)+' tries left.';}}
  else S.pinMsg='That PIN is not right. Tap your name for a clearer message.';
  S.pinEntry='';
}

function quoteBuilder(){
  var r=S.referrer,c=r.dclient||{};
  if(!r.draft.length&&!r.editing)return '<div class="empty"><strong>No products on this quote yet</strong>Add products from the catalogue to start a quote.<div style="margin-top:12px"><button class="btn" data-action="rTab" data-v="catalogue">Open catalogue</button></div></div>';
  var q=r.editing?findQuote(r.editing):null;
  var rows=r.draft.map(function(it,i){var p=prod(it.pid);var unit=(it.mode==='hire'?p.hire:p.buy)*CONTRACT_RATE;return '<tr><td>'+esc(p.name)+'<input type="text" value="'+esc(it.note||'')+'" data-input="rNote" data-v="'+i+'" placeholder="Colour, size or notes" aria-label="Colour, size or notes for '+esc(p.name)+'" style="margin-top:6px;min-height:36px;padding:6px 10px;font-size:.875rem"></td><td>'+(it.mode==='hire'?'Hire /wk':'Purchase')+'</td><td><input type="number" min="1" value="'+it.qty+'" data-input="rQty" data-v="'+i+'" aria-label="Quantity" style="width:72px;min-height:38px;padding:6px"></td><td class="num">'+money(unit*it.qty)+'</td><td class="num"><button class="btn sm" data-action="rRemove" data-v="'+i+'">Remove</button></td></tr>';}).join('');
  var h=q?'<h2>Edit '+q.id+'</h2><div class="notice info">Change products, quantities or colours before the quote is approved. Saving creates revision '+((q.rev||1)+1)+' and an updated PDF.</div>':'<h2>New quote</h2>';
  h+=(rows?'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Type</th><th>Qty</th><th class="num">Contract price</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No products on this quote yet.</div>')+'<div class="row" style="margin-top:12px"><button class="btn sm" data-action="rTab" data-v="catalogue">Add more products</button></div>';
  h+='<fieldset style="margin-top:16px"><legend>Client</legend><div class="grid2"><label class="f"><span class="req">Client name</span><input type="text" id="q_client" value="'+esc(c.client||'')+'" data-input="rClient" data-k="client"></label><label class="f">Phone<input type="tel" id="q_phone" value="'+esc(c.phone||'')+'" data-input="rClient" data-k="phone"></label><label class="f"><span class="req">Delivery address</span><input type="text" id="q_address" value="'+esc(c.address||'')+'" data-input="rClient" data-k="address"></label><label class="f">Funding<select id="q_funding" data-action="rFunding">'+opt(['Home Care Package','Transitional care','NDIS','Return to Work SA','Private'],c.funding||'Home Care Package')+'</select></label></div></fieldset>';
  return h+(q?'<div class="row"><button class="btn primary" data-action="createQuote">Save changes</button><button class="btn" data-action="cancelEdit">Cancel</button></div>':'<div class="row"><button class="btn primary" data-action="createQuote">Create quote</button><span class="small muted">You can download the PDF and send it for approval straight away.</span></div>');
}
function quoteTotal(q){var t=0;q.items.forEach(function(it){var p=prod(it.pid);t+=(it.mode==='hire'?p.hire:p.buy)*CONTRACT_RATE*it.qty;});return t;}
function quotesView(){
  var r=S.referrer;
  if(!r.quotes.length)return '<div class="empty"><strong>No quotes yet</strong>Build one from the catalogue.</div>';
  return '<h2>Quotes</h2><div class="tablewrap"><table><thead><tr><th>Quote</th><th>Client</th><th>Funding</th><th>Status</th><th class="num">Total</th><th></th></tr></thead><tbody>'+
    r.quotes.slice().reverse().map(function(q){var cls=q.status==='Approved'?'ok':q.status==='Declined'?'bad':'warn';
      return '<tr><td>'+q.id+'<div class="small muted">'+fmtDate(q.created)+((q.rev||1)>1?', rev '+q.rev+' on '+fmtDate(q.revised):'')+'</div></td><td>'+esc(q.client)+'</td><td>'+esc(q.funding)+'</td><td><span class="chip '+cls+'">'+q.status+'</span>'+(q.order?'<div class="small muted">Order '+q.order+'</div>':'')+'</td><td class="num">'+money(quoteTotal(q))+'</td><td class="num"><button class="btn sm" data-action="viewQuote" data-v="'+q.id+'">PDF</button> '+
      (q.status==='Awaiting approval'?'<button class="btn sm" data-action="editQuote" data-v="'+q.id+'">Edit</button> <button class="btn sm primary" data-action="approveQuote" data-v="'+q.id+'">Approve</button> <button class="btn sm" data-action="declineQuote" data-v="'+q.id+'">Decline</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function invoicesView(){
  var r=S.referrer,out=0,over=0;
  r.invoices.forEach(function(i){if(i.status!=='Paid'){out+=i.amt;if(i.status==='Overdue')over+=i.amt;}});
  return '<div class="tiles"><div class="tile" style="cursor:default"><div class="k">Outstanding</div><div class="v">'+money(out)+'</div></div><div class="tile'+(over?' alert':'')+'" style="cursor:default"><div class="k">Overdue</div><div class="v">'+money(over)+'</div></div><div class="tile" style="cursor:default"><div class="k">Terms</div><div class="v" style="font-size:1.1rem">30 days from invoice</div><button class="btn sm" style="margin-top:6px" data-action="statement">View statement</button></div></div>'+
    '<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Details</th><th>Due</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead><tbody>'+
    r.invoices.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(i){var cls=i.status==='Paid'?'ok':i.status==='Overdue'?'bad':'info';
      return '<tr><td>'+i.id+'<div class="small muted">'+fmtDate(i.date)+'</div></td><td>'+esc(i.desc)+'</td><td>'+fmtDate(i.due)+'</td><td><span class="chip '+cls+'">'+i.status+'</span></td><td class="num">'+money(i.amt)+'</td><td class="num">'+(i.status!=='Paid'?'<button class="btn sm" data-action="payInvoice" data-v="'+i.id+'">Pay now</button>':'')+'</td></tr>';}).join('')+
    '</tbody></table></div><p class="small muted" style="margin-top:8px">Invoices sync from Xero. Bank transfer is still welcome; Pay now uses Stripe.</p>';
}
function findQuote(id){var r=null;S.referrer.quotes.forEach(function(q){if(q.id===id)r=q;});return r;}
function findInv(id){var r=null;S.referrer.invoices.forEach(function(q){if(q.id===id)r=q;});return r;}
function docHead(title,right){return '<div class="dh"><div><img src="/images/brand/max-logo.png" alt="Max Healthcare Equipment"><div class="small muted" style="margin-top:6px">Max Healthcare Equipment, Kilburn SA. '+MAX_PHONE+'</div></div><div style="text-align:right"><h2 style="margin:0">'+esc(title)+'</h2><div class="small muted">'+right+'</div></div></div>';}
function showQuote(id){
  var q=findQuote(id),r=S.referrer;

    '<div class="grid2"><div><div class="small muted">Prepared for</div><strong>'+esc(q.client)+'</strong><br>'+esc(q.address)+'<br>'+esc(q.phone)+'</div><div><div class="small muted">Requested by</div><strong>'+esc(r.user)+'</strong><br>'+esc(r.org)+'<br>Funding: '+esc(q.funding)+'</div></div><hr>'+
    '<table><thead><tr><th>Item</th><th>Qty</th><th class="num">Amount</th></tr></thead><tbody>'+q.items.map(function(it){var p=prod(it.pid);var u=(it.mode==='hire'?p.hire:p.buy)*CONTRACT_RATE;return '<tr><td>'+esc(p.name)+(it.mode==='hire'?' (hire, per week)':'')+(it.note?'<div class="small muted">'+esc(it.note)+'</div>':'')+'</td><td>'+it.qty+'</td><td class="num">'+money(u*it.qty)+'</td></tr>';}).join('')+
    '</tbody></table><p style="text-align:right;margin-top:12px"><strong>Total '+money(quoteTotal(q))+' incl. GST</strong></p><p class="small muted">Contract pricing for '+esc(r.org)+'. Approve in the partner portal to place the order.</p></div>'+
    '<div class="row no-print" style="margin-top:16px"><button class="btn primary" data-action="print">Download PDF</button><button class="btn" data-action="closeModal">Close</button></div>');

function renderMax(){
  var mx=S.mx;
  var problems=S.agreements.filter(function(a){return a.status==='Payment Failed'||a.attention;}).length;
  var tabs=tabBar([['hub','Hire hub'],['console','Hire console',problems||''],['list','Hire agreements'],['portals','Portals and orders']],mx.ha&&mx.tab==='list'?'list':mx.tab,'mxTab');
  var body=mx.ha?agreementDetail(haById(mx.ha)):mx.tab==='hub'?hubView():mx.tab==='console'?consoleView():mx.tab==='list'?listView():portalsView();
  return frame('maxhealthcareequipment.lightning.force.com/lightning/n/Hire_Hub',brand('Salesforce, what Max staff see')+'<div class="who"><strong>Hire team</strong><br><span class="muted">Kilburn</span></div>',tabs,body);
}
function within(d,days){return d&&daysUntil(d)<=0&&daysUntil(d)>=-days;}
function hubView(){
  var act=S.agreements.filter(function(a){return a.status==='Active'||a.status==='Payment Failed';});
  var run=sum(S.agreements.filter(function(a){return a.status==='Active'&&a.plan===WEEKLY&&!a.paused;}).map(weeklyNet));
  var taken=sum(S.agreements.map(function(a){return sum(a.payments.filter(function(p){return !p.failed&&!p.refund&&within(p.date,6);}).map(function(p){return p.amt;}));}));
  var due=sum(S.agreements.filter(function(a){return a.status==='Active'&&a.plan===WEEKLY&&a.nextCharge&&daysUntil(a.nextCharge)>=0&&daysUntil(a.nextCharge)<=7;}).map(weeklyNet));
  var risk=sum(S.agreements.filter(function(a){return a.status==='Payment Failed';}).map(weeklyNet));
  var h='<div class="tiles"><button class="tile" data-action="mxList" data-v="running"><div class="k">Weekly run rate</div><div class="v">'+money(run)+'</div><div class="s">from weekly subscriptions</div></button>'+
    '<button class="tile" data-action="mxList" data-v="taken"><div class="k">Collected this week</div><div class="v">'+money(taken)+'</div><div class="s">successful payments, last 7 days</div></button>'+
    '<button class="tile" data-action="mxList" data-v="running"><div class="k">Due next 7 days</div><div class="v">'+money(due)+'</div><div class="s">scheduled weekly charges</div></button>'+
    '<button class="tile alert" data-action="mxList" data-v="problems"><div class="k">At risk</div><div class="v">'+money(risk)+'</div><div class="s">a week on failed payments</div></button></div>';
  var all=S.agreements.filter(function(a){return !isSaleOnly(a);});
  var sent=all.length,opened=all.filter(function(a){return a.opened;}).length,chosen=all.filter(function(a){return a.plan!==NONE;}).length,paid=all.filter(function(a){return a.payments.some(function(p){return !p.failed;});}).length;
  var mix=[['Weekly',all.filter(function(a){return a.plan===WEEKLY&&a.status!=='Completed';}).length,''],['4 weeks upfront',all.filter(function(a){return a.plan===UPFRONT&&a.status!=='Completed';}).length,'red'],['Not chosen yet',all.filter(function(a){return a.plan===NONE;}).length,'grey'],['Ended or ending',all.filter(function(a){return a.status==='Completed'||a.status==='Opt Out Requested'||a.status==='Awaiting Collection';}).length,'grey']];
  var bars=function(list,max){return list.map(function(b){return '<div class="bar"><span>'+esc(b[0])+'</span><span class="track"><span class="fill '+(b[2]||'')+'" style="width:'+(max?Math.round(b[1]/max*100):0)+'%"></span></span><span class="n">'+b[1]+'</span></div>';}).join('');};
  h+='<div class="hub"><div class="panel"><h2>Needs action</h2>'+queueList()+'</div><div class="stack"><div class="panel"><h2>Payment funnel</h2><p class="small muted" style="margin-top:-6px">From payment link to paid, for hires in this demo.</p>'+bars([['Link sent',sent],['Opened',opened],['Plan chosen',chosen],['Paid',paid,'red']],sent)+'</div><div class="panel"><h2>Plan mix</h2>'+bars(mix,Math.max.apply(null,mix.map(function(m){return m[1];}))||1)+'</div></div></div>';
  return h;
}
function queueItems(){
  var out=[];
  S.agreements.forEach(function(a){
    if(a.status==='Payment Failed')out.push([a,'bad','Payment declined',money(weeklyNet(a))+' a week, '+(a.attention||'card needs updating')]);
    else if(a.attention)out.push([a,'bad','Needs attention',a.attention]);
    var t=S.threads[a.mobile];if(t&&t.msgs.some(function(m){return m.dir==='in'&&!m.read;}))out.push([a,'info','Reply to read','"'+t.msgs.filter(function(m){return m.dir==='in'&&!m.read;}).slice(-1)[0].body+'"']);
    if(a.status==='Opt Out Requested'||hireLines(a).some(function(l){return l.state==='collect';})){var j=a.jobs.filter(function(x){return x.type==='Collection'&&x.status==='Requested';})[0];if(j)out.push([a,'warn','Collection to book',(j.method==='Patient Drop Off'?'Dropping off':'Preferred '+fmtDate(j.date))+', '+(a.endReason||'')]);}
    if(a.status==='Awaiting Payment')out.push([a,'warn','Waiting for payment',a.opened?'Opened the link, not paid yet':'Link not opened yet']);
    if(a.plan===UPFRONT&&a.status==='Active'&&a.termEnd&&daysUntil(a.termEnd)<=5)out.push([a,'info','Four weeks ending','Covered until '+fmtDate(a.termEnd)]);
    a.jobs.forEach(function(j){if(j.type==='Delivery'&&j.status==='Completed'&&!j.confirmSent)out.push([a,'info','Delivery confirmation to send',j.id+' delivered '+fmtDate(j.date)]);});
  });
  return out;
}
function queueList(){var q=queueItems();if(!q.length)return '<div class="empty"><strong>All clear</strong>Nothing needs a person right now.</div>';return q.map(function(x){return '<button class="q" data-action="mxOpen" data-v="'+x[0].id+'"><span class="dot '+x[1]+'"></span><span class="tx"><strong>'+esc(x[2])+': '+esc(fullName(x[0]))+'</strong><span>'+esc(x[3])+'</span></span><span class="small muted">'+x[0].id+'</span></button>';}).join('');}
function consoleView(){
  var mx=S.mx;
  var running=S.agreements.filter(function(a){return a.status==='Active';});
  var taken=sum(S.agreements.map(function(a){return sum(a.payments.filter(function(p){return !p.failed&&!p.refund&&within(p.date,6);}).map(function(p){return p.amt;}));}));
  var h='<div class="tiles"><button class="tile" data-action="mxList" data-v="running"><div class="k">Hires running</div><div class="v">'+running.length+'</div><div class="s">'+money(sum(running.filter(function(a){return a.plan===WEEKLY;}).map(weeklyNet)))+' a week</div></button>'+
    '<button class="tile" data-action="mxList" data-v="taken"><div class="k">Taken this week</div><div class="v">'+money(taken)+'</div><div class="s">successful payments since Monday</div></button>'+
    '<button class="tile'+(unreadInbound()?' alert':'')+'" data-action="mxList" data-v="replies"><div class="k">Replies to read</div><div class="v">'+unreadInbound()+'</div><div class="s">inbound texts nobody has opened</div></button>'+
    '<button class="tile'+(undelivered()?' alert':'')+'" data-action="mxList" data-v="undelivered"><div class="k">Not delivered</div><div class="v">'+undelivered()+'</div><div class="s">failed sends in the last 14 days</div></button>'+
    '<button class="tile" data-action="mxSending"><div class="k">Sending</div><div class="v">'+(S.paused?'Paused':'On')+'</div><div class="s">8am to 8pm, Adelaide time</div></button></div>';
  var Q={problems:['Payment problems','Declined payments and anything flagged for a person.',function(a){return a.status==='Payment Failed'||!!a.attention;}],
    waiting:['Waiting for payment','Payment link sent, patient has not paid yet.',function(a){return a.status==='Awaiting Payment';}],
    ending:['Ending','Patient has finished with some or all of the equipment.',function(a){return a.status==='Opt Out Requested'||a.status==='Awaiting Collection'||hireLines(a).some(function(l){return l.state==='collect';});}],
    renewal:['Four weeks ending','Upfront hires covered for five days or less.',function(a){return a.plan===UPFRONT&&a.status==='Active'&&a.termEnd&&daysUntil(a.termEnd)<=5;}]};
  var cur=Q[mx.queue]||Q.problems;
  h+='<div class="row" role="tablist" style="margin-bottom:12px">'+Object.keys(Q).map(function(k){var n=S.agreements.filter(Q[k][2]).length;return '<button class="btn sm '+(mx.queue===k?'dark':'')+'" data-action="mxQueue" data-v="'+k+'" aria-pressed="'+(mx.queue===k)+'">'+Q[k][0]+' ('+n+')</button>';}).join('')+'</div>';
  h+='<h2>'+cur[0]+'</h2><p class="muted small">'+cur[1]+'</p>'+agTable(S.agreements.filter(cur[2]));
  return h;
}
function agTable(list){
  if(!list.length)return '<div class="empty"><strong>Nothing here</strong>This list fills up as hires need attention.</div>';
  return '<div class="tablewrap"><table><thead><tr><th>Hire</th><th>Patient</th><th>Status</th><th class="num">Per week</th><th class="num">Paid</th><th>Items</th></tr></thead><tbody>'+list.map(function(a){
    return '<tr class="click" data-action="mxOpen" data-v="'+a.id+'"><td><a href="#" data-action="mxOpen" data-v="'+a.id+'">'+a.id+'</a><div class="small muted">Order '+esc(a.order)+'</div></td><td>'+esc(fullName(a))+'<div class="small muted">'+esc(a.mobile)+'</div></td><td>'+chip(a)+'<div class="small muted">'+esc(a.plan)+'</div></td><td class="num">'+(isSaleOnly(a)?'':money(a.plan===NONE?quote(a).perWeek:weeklyNet(a)))+'</td><td class="num">'+money(paidSoFar(a))+'</td><td class="small">'+a.lines.map(function(l){return esc(prod(l.pid).name);}).join(', ')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function listView(){
  var f=S.mx.list,list=S.agreements.slice().reverse(),title='All hire agreements';
  if(f==='running'){list=list.filter(function(a){return a.status==='Active';});title='Hires running';}
  if(f==='problems'){list=list.filter(function(a){return a.status==='Payment Failed';});title='Payments at risk';}
  if(f==='replies'){list=list.filter(function(a){var t=S.threads[a.mobile];return t&&t.msgs.some(function(m){return m.dir==='in'&&!m.read;});});title='Replies to read';}
  if(f==='undelivered'){list=list.filter(function(a){var t=S.threads[a.mobile];return t&&t.msgs.some(function(m){return m.failed;});});title='Texts not delivered';}
  if(f==='taken'){var rows=[];S.agreements.forEach(function(a){a.payments.forEach(function(p){if(!p.failed&&within(p.date,6))rows.push([a,p]);});});
    return '<div class="row between"><h2 style="margin:0">Payments taken this week</h2><button class="btn sm" data-action="mxList" data-v="">Show all agreements</button></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Hire</th><th>Patient</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>'+rows.map(function(x){return '<tr class="click" data-action="mxOpen" data-v="'+x[0].id+'"><td>'+fmtDate(x[1].date)+'</td><td>'+x[0].id+'</td><td>'+esc(fullName(x[0]))+'</td><td>'+esc(x[1].type)+'</td><td class="num">'+(x[1].refund?'-':'')+money(x[1].amt)+'</td></tr>';}).join('')+'</tbody></table></div>';}
  return '<div class="row between" style="margin-bottom:12px"><h2 style="margin:0">'+title+'</h2>'+(f?'<button class="btn sm" data-action="mxList" data-v="">Show all agreements</button>':'')+'</div>'+agTable(list);
}

  var rows=S.orders.slice().reverse().map(function(o){var a=haById(o.ha);var st=staffById(o.staffId);return '<tr><td>'+o.id+'</td><td><span class="chip grey">'+esc(o.source)+'</span></td><td>'+esc(a?fullName(a):(o.patient||''))+'</td><td>'+(a?chip(a):'<span class="chip ok">On account</span>')+'</td><td class="small">'+o.items.map(function(it){return esc(prod(it.pid).name);}).join(', ')+'</td><td class="small">'+esc(st?st.name+', '+S.hospital.name:o.createdBy||'')+'</td></tr>';}).join('');

}
function agreementDetail(a){
  var mx=S.mx,t=S.threads[a.mobile]||{msgs:[]};
  var on=hireLines(a).filter(function(l){return l.state==='on';}).length,col=hireLines(a).filter(function(l){return l.state==='collect';}).length,back=hireLines(a).filter(function(l){return l.state==='back';}).length;
  var h='<button class="btn quiet sm" style="padding-left:0" data-action="mxClose">Back to '+(mx.tab==='hub'?'hire hub':mx.tab==='console'?'hire console':'the list')+'</button>';
  h+='<div class="dhead"><h1>'+a.id+'</h1>'+chip(a)+'<span class="chip grey">'+esc(a.plan)+'</span>'+(a.attention?'<span class="chip bad">'+esc(a.attention)+'</span>':'')+'</div>';

/* ---------- phone navigation ---------- */
function openPortal(tok){
  var P=S.phone;P.app='browser';P.token=tok;P.view=null;P.stripe=null;P.flash=null;P.endDone=null;P.newSent=false;P.login=null;S.f={};S.pv.cart=[];S.pv.q='';
  var ln=S.links[tok];if(ln){var a=haById(ln.ha);if(a){a.opened=true;P.mobile=a.mobile;}}

function latestToken(a){var t=S.threads[a.mobile];if(!t)return null;for(var i=t.msgs.length-1;i>=0;i--){if(t.msgs[i].token)return t.msgs[i].token;}return null;}
function startStripe(a,amount,label,then,purpose,extra){var st={ha:a.id,amount:r2(amount),label:label,then:then,purpose:purpose};for(var k in extra)st[k]=extra[k];S.phone.stripe=st;}
function finishStripe(){
  var P=S.phone,st=P.stripe,a=haById(st.ha);
  if(st.purpose==='first'){
    var f=S.f;
    if(a.needsDetails){var nm=(f.pl_name||'').trim().split(' ');a.first=nm[0];a.last=nm.slice(1).join(' ');a.dob=f.pl_dob;a.email=f.pl_email||'';a.address={line1:f.pl_line1,line2:'',suburb:f.pl_suburb,state:'SA',postcode:f.pl_pc};a.needsDetails=false;thread(a.mobile,fullName(a));}
    a.plan=st.plan;a.start=today();a.card=st.plan===WEEKLY?'Visa ending 4242':'';
    if(isSaleOnly(a)){a.status='Sale Only';}else{a.status='Active';if(a.plan===WEEKLY)a.nextCharge=today(7);else a.termEnd=today(28);}
    var sale=saleOwing(a);saleLines(a).forEach(function(l){l.paid=true;});
    pay(a,st.amount,isSaleOnly(a)?'Purchase':(a.plan===WEEKLY?'First payment':'4 weeks upfront')+(sale&&!isSaleOnly(a)?', includes purchase':''));
    tl(a,'pay','Payment taken through Stripe',a.plan+', '+money(st.amount)+'. Consent recorded on terms v'+CFG.termsVersion+'.');
    var o=S.orders.filter(function(x){return x.ha===a.id;})[0];
    if(o&&o.supply==='Taken from consignment room'){a.lines.forEach(function(l){l.state='on';});}
    else{a.jobs.push({id:'WO-0'+(S.seq.wo++),type:'Delivery',status:'Requested',date:nextWorkingDay(),window:'AM (8am to 12pm)',method:'Max Delivery',address:addr(a),notes:'',contact:a.mobile,driver:'',items:a.lines.map(function(l){return l.id;})});}
    text(a,'Thanks '+a.first+', payment received. Manage your hire, see receipts or tell us when you have finished here:','manage',{title:'Payment received text'});touch(a.mobile);
    if(o&&S.session)audit('Patient paid, hire agreement active',o.id);
    P.token=latestToken(a);
  }else if(st.purpose==='renew'){a.termEnd=addDays(a.termEnd,28);pay(a,st.amount,'4 weeks renewal');tl(a,'pay','Renewed for four more weeks','Covered until '+fmtDate(a.termEnd));text(a,'Thanks '+a.first+', your hire is covered until '+fmtDate(a.termEnd)+'.',null,{title:'Renewal receipt text'});touch(a.mobile);}
  else if(st.purpose==='switch'){a.plan=WEEKLY;a.card='Visa ending 4242';a.nextCharge=a.termEnd;tl(a,'event','Switched to weekly payments','First weekly charge on '+fmtDate(a.termEnd));a.termEnd='';text(a,'Thanks '+a.first+', you are now on weekly payments of '+money(weeklyNet(a))+', starting '+fmtDate(a.nextCharge)+'.',null,{title:'Plan change text'});touch(a.mobile);}
  else if(st.purpose==='sale'){var amt=saleOwing(a);saleLines(a).forEach(function(l){l.paid=true;});pay(a,amt,'Purchase');tl(a,'pay','Purchase paid',money(amt));if(!a.jobs.some(function(j){return j.status!=='Completed';}))a.jobs.push({id:'WO-0'+(S.seq.wo++),type:'Delivery',status:'Requested',date:nextWorkingDay(),window:'AM (8am to 12pm)',method:'Max Delivery',address:addr(a),notes:'',contact:a.mobile,driver:'',items:saleLines(a).map(function(l){return l.id;})});}
  else if(st.purpose==='card'){a.card='Visa ending 4242';tl(a,'event','Card updated by the patient','Visa ending 4242');a.retried=false;if(a.status==='Payment Failed'){a.status='Active';a.attention='';pay(a,weeklyNet(a),'Weekly hire, retried');a.nextCharge=today(7);a.retried=true;tl(a,'pay','Retried payment succeeded',money(weeklyNet(a)));}}
  P.stripe=null;P.view=null;P.flash={card:'card',renew:'renewed',switch:'switched'}[st.purpose]||'paid';S.f={};
}

/* ---------- actions ---------- */
function act(a,v,el){
  var P=S.phone,f=S.f,x;
  switch(a){
  case 'persona':S.persona=v;S.mx.ha=null;break;
  case 'reset':modal('<h2>Reset the demo?</h2><p>All hires, orders, staff changes, quotes and messages go back to the starting data.</p><div class="row"><button class="btn primary" data-action="confirmReset">Reset demo</button><button class="btn" data-action="closeModal">Cancel</button></div>');return;
  case 'confirmReset':seed();clearTimeout(idleTimer);closeModal();toast('Demo reset.');break;
  case 'closeModal':closeModal();return;
  case 'print':window.print();return;

  /* phone */
  case 'phApp':P.app=v;if(v!=='browser'){P.stripe=null;}if(v==='home'){P.mobile=null;}break;
  case 'phThread':P.app='thread';P.mobile=v;S.f.ph_reply='';break;
  case 'phOpen':openPortal(v);break;
  case 'phSite':P.app='browser';P.token=null;P.view='login';P.login={};P.stripe=null;P.mobile=null;S.f={};break;
  case 'phReply':{var body=(f.ph_reply||'').trim();if(!body)return;var t=S.threads[P.mobile];t.msgs.push({dir:'in',body:body,at:stamp(),read:false,seen:true});var ha=haByMobile(P.mobile);if(ha)tl(ha,'sms','Patient replied',body);touch(P.mobile);f.ph_reply='';toast('Reply sent. Max staff see it in the hire console.');break;}
  case 'scenText':{var sa=haById(v);P.app='thread';P.mobile=sa.mobile;break;}
  case 'scenOpen':{var so=haById(v);openPortal(latestToken(so));break;}

  /* plan selection */
  case 'plPlan':f.pl_plan=v;f.pl_err='';S._keepScroll=true;break;
  case 'plConsent':f.pl_consent=el.checked;S._keepScroll=true;break;
  case 'plTerms':f.pl_terms=!f.pl_terms;S._keepScroll=true;break;
  case 'plContinue':{x=haById(S.links[P.token].ha);
    if(x.needsDetails&&(!(f.pl_name||'').trim()||!f.pl_dob||!(f.pl_line1||'').trim()||!(f.pl_suburb||'').trim()||!/^\d{4}$/.test(f.pl_pc||''))){f.pl_err='Add your full name, date of birth and address so we can deliver to you.';S._keepScroll=true;break;}
    var q=quote(x);
    if(isSaleOnly(x))startStripe(x,q.sale,'Order '+x.order,'','first',{plan:NONE});
    else if(f.pl_plan==='weekly')startStripe(x,q.weeklyToday,'Equipment hire, weekly','Then A'+money(q.perWeek)+' each week','first',{plan:WEEKLY});
    else startStripe(x,q.upfrontToday,'Equipment hire, 4 weeks upfront','Covers four weeks of hire','first',{plan:UPFRONT});
    tl(x,'event','Plan chosen in the portal',S.phone.stripe.plan);
    break;}
  case 'stripePay':P.stripe.processing=true;P.stripe.declined=false;save();render();setTimeout(function(){if(!S.phone.stripe)return;finishStripe();save();render();var sc=document.getElementById('phScroll');if(sc)sc.scrollTop=0;},900);return;
  case 'stripeDecline':P.stripe.declined=true;break;
  case 'stripeBack':P.stripe=null;break;

  /* manage */
  case 'updateCard':x=haById(S.links[P.token].ha);startStripe(x,0,'','','card');break;
  case 'paySale':x=haById(S.links[P.token].ha);startStripe(x,saleOwing(x),'Purchase for order '+x.order,'','sale');break;
  case 'ptEnd':P.view='end';P.endDone=null;S.f={};P.flash=null;break;
  case 'ptShop':P.view='shop';P.flash=null;break;
  case 'ptBack':P.view=null;break;

    text(x,body+(kind?' ':''),kind,{title:'Text sent by staff'});(S.threads[x.mobile]||{msgs:[]}).msgs.forEach(function(m){m.read=true;});touch(x.mobile);f.mx_draft='';f.mx_tpl='';f.mx_link='';toast('Sent.');break;}
  case 'mxBook':bookModal(x);return false;
  case 'mxBookSave':{var type=document.getElementById('bk_type').value,date=document.getElementById('bk_date').value,win=document.getElementById('bk_window').value,urg=document.getElementById('bk_urgent').checked,tx=document.getElementById('bk_text').checked;
    var its=[].slice.call(document.querySelectorAll('.bk_it:checked')).map(function(i){return i.value;});
    if(!its.length){toast('Choose at least one item.');return false;}
    if(date===today()&&!urg){toast('Same day is only for urgent jobs. Tick Urgent or pick another day.');return false;}
    var job={id:'WO-0'+(S.seq.wo++),type:type,status:'Scheduled',date:date,window:win,method:type==='Delivery'?'Max Delivery':'Max Collection',address:addr(x),notes:'',contact:x.mobile,driver:'',items:its,confirmed:false};
    x.jobs=x.jobs.filter(function(j){return !(j.type===type&&j.status==='Requested');});x.jobs.push(job);
    if(type==='Collection')x.lines.forEach(function(l){if(its.indexOf(l.id)>-1&&l.state==='on')l.state='collect';});
    tl(x,'event',type+' booked',fmtDate(date)+', '+win+(urg?', urgent':''));
    if(tx){text(x,'Hi '+(x.first||'there')+', your Max Healthcare '+type.toLowerCase()+' is booked for '+fmtDate(date)+', '+(win.indexOf('AM')===0?'morning':'afternoon')+'. Please check your details here:','logistics',{title:type+' details link sent'});touch(x.mobile);}
    closeModal();toast(type+' booked.');break;}
  case 'mxJobDone':{var jb=x.jobs.filter(function(j){return j.id===v;})[0];jb.status='Completed';jb.date=today();jb.driver=jb.driver||'Dean K.';jb.sa=jb.sa||'SA-0'+(S.seq.sa++);
    x.lines.forEach(function(l){if(jb.items.indexOf(l.id)>-1){if(jb.type==='Delivery'){l.state=l.mode==='hire'?'on':'on';if(l.mode==='hire'&&!x.start)x.start=today();}else{l.state='back';l.returnedOn=today();}}});
    if(jb.type==='Collection'&&hireLines(x).every(function(l){return l.state==='back';})){x.status='Completed';x.nextCharge='';}
    tl(x,'event',jb.type+' completed',jb.id+', service report '+jb.sa);toast(jb.type+' marked completed.');break;}
  case 'mxConfirm':confirmDoc(x,x.jobs.filter(function(j){return j.id===v;})[0]);return false;
  case 'mxConfirmSend':{var jc=x.jobs.filter(function(j){return j.id===v;})[0];jc.confirmSent=true;text(x,'Hi '+(x.first||'there')+', your Max Healthcare equipment was delivered today. Photos and the signed service report are in your email.',null,{title:'Delivery confirmation sent'});touch(x.mobile);tl(x,'event','Delivery confirmation emailed','Driver photos and '+(jc.sa||'service report')+' only');closeModal();toast('Delivery confirmation sent.');break;}
  case 'mxInvoice':invoiceDoc(x,x.payments.filter(function(p){return p.id===v;})[0]);return false;
  case 'mxStatement':statementDoc(x);return false;
  default:return false;
  }
}
function fixedModal(x){var w=S.f.fx_w,g=contracted(x);modal('<h2>Charge a set number of weeks</h2><p class="muted">For hires with no saved card. The patient gets a link to pay for exactly these weeks.</p><div class="stepper"><button class="btn sm" data-action="mxFixedDown" aria-label="One week fewer">- 1 week</button><strong style="min-width:90px;text-align:center">'+w+' week'+(w>1?'s':'')+'</strong><button class="btn sm" data-action="mxFixedUp" aria-label="One week more">+ 1 week</button></div><div class="kv total" style="margin-top:12px"><span class="k">To pay</span><span class="v">'+money(r2(g*w))+'</span></div><div class="row" style="margin-top:16px"><button class="btn primary" data-action="mxFixedSave">Text the payment link</button><button class="btn" data-action="closeModal">Cancel</button></div>');}
function refundModal(x){var w=S.f.rf_w,per=x.plan===WEEKLY?weeklyNet(x):contracted(x);modal('<h2>Prepare a refund</h2><p class="muted">For an early return. Call the customer first. Add or take off a week, or change the amount, before it is raised.</p><div class="stepper"><button class="btn sm" data-action="mxRefundDown">- 1 week</button><strong style="min-width:90px;text-align:center">'+w+' of 4 weeks</strong><button class="btn sm" data-action="mxRefundUp">+ 1 week</button></div><label class="f" style="margin-top:12px">Refund amount<input type="number" step="0.01" id="rf_amt" value="'+r2(per*w)+'"></label><p class="small muted" style="margin-top:6px">Refunds above $200 go to an admin for approval before the money goes back to the card.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-action="mxRefundSave">Raise refund</button><button class="btn" data-action="closeModal">Cancel</button></div>');}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');
  if(!t)return;
  if(t.getAttribute('data-action')==='closeModal'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  if(t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type!=='checkbox'))return;
  if(t.tagName==='A'||t.tagName==='TR')e.preventDefault();
  act(t.getAttribute('data-action'),t.getAttribute('data-v'),t);
  if(S.persona==='hospital'&&S.session)armIdle();
  if(/^(scenText|scenOpen|phSite)$/.test(t.getAttribute('data-action'))&&window.innerWidth<=1040){var pw=document.querySelector('.phone-wrap');if(pw)pw.scrollIntoView({behavior:'smooth',block:'start'});}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-bind')&&t.tagName==='SELECT'){S.f[t.getAttribute('data-bind')]=t.value;save();}
  if(t.tagName!=='SELECT')return;var a=t.getAttribute('data-action');if(a){act(a,t.getAttribute('data-v'),t);}
  else if(t.hasAttribute('data-bind')){S._keepScroll=true;render();}
});
var searchTimer=null;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-bind')){S.f[t.getAttribute('data-bind')]=t.value;save();if(t.getAttribute('data-bind')==='mx_draft'){var c=t.parentNode.querySelector('.row .small');if(c)c.textContent=t.value.length+' / 1600';}return;}
  var k=t.getAttribute('data-input');if(!k)return;
  if(k==='rNote'){S.referrer.draft[Number(t.getAttribute('data-v'))].note=t.value;save();return;}
  if(k==='rClient'){S.referrer.dclient[t.getAttribute('data-k')]=t.value;save();return;}
  clearTimeout(searchTimer);searchTimer=setTimeout(function(){
    if(k==='draftSearch'){readDraft();S.draft.q=t.value;}
    if(k==='ptSearch')S.pv.q=t.value;
    if(k==='rfSearch')S.referrer.q=t.value;
    if(k==='rQty'){var it=S.referrer.draft[Number(t.getAttribute('data-v'))];it.qty=Math.max(1,parseInt(t.value,10)||1);}
    save();S._keepScroll=true;renderKeepFocus(t.id||null,k,t.getAttribute('data-v'));
  },250);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-bind')==='ph_reply'){act('phReply');return;}
  if(e.key==='Escape'&&document.querySelector('.modal')){closeModal();return;}
  if(S.persona!=='hospital'||S.session||S.setPin)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(/^\d$/.test(e.key))act('pinKey',e.key);
  else if(e.key==='Enter')act('pinKey','enter');
  else if(e.key==='Backspace'){S.pinEntry=S.pinEntry.slice(0,-1);render();}
});
function renderKeepFocus(id,k,v){
  var pos=document.activeElement&&document.activeElement.selectionStart;
  render();
  var el=id?document.getElementById(id):document.querySelector('[data-input="'+k+'"]'+(v!=null?'[data-v="'+v+'"]':''));
  if(el){el.focus();try{if(pos!=null&&el.setSelectionRange)el.setSelectionRange(pos,pos);}catch(err){}}
}
['mousemove','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(S.persona==='hospital'&&S.session){clearTimeout(armIdle.t);armIdle.t=setTimeout(armIdle,500);}},{passive:true});});
function viewFromHash(){var v=location.hash.slice(1);if(v==='staff')v='max';if(['hospital','patient','referrer','max'].indexOf(v)>-1){S.persona=v;return true;}return false;}
window.addEventListener('hashchange',function(){if(viewFromHash()){save();render();}});
viewFromHash();
if(S.session)armIdle();
render();
setInterval(function(){var sb=document.querySelector('.sbar span');if(sb)sb.textContent=clock();},30000);
})();
</script>
